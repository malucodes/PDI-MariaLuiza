<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PDI · Maria Luiza Benevides</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   macOS DESKTOP COLLAGE — pastel Y2K / "girly tech"
   Design-only layer. All content still comes from data.js.
   ===================================================================== */
:root{
  --sky1:#BFD6F0;--sky2:#A9C8EC;           /* sky background */
  --card:#fff;--off:#F7F7F9;               /* windows */
  --ink:#111;--graph:#2B2B2E;--mute:#505665;--line:#E4E9F1;
  --pink:#FF5FA2;--pink2:#F7A8C8;--pale:#FFE3EF;--ac:#C42672;   /* pink: fills / soft / text-safe */
  --yellow:#FFE94A;                         /* highlighter */
  --blue:#2F7BF6;--blue2:#2563E0;--ac2:#2563E0;
  --red:#C92A2A;--dr:#FF5F57;--dy:#FEBC2E;--dg:#28C840;  /* traffic lights */
  --shadow:0 22px 50px -14px rgba(40,80,140,.30),0 2px 6px rgba(40,80,140,.08);
  --glass:rgba(255,255,255,.58);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;min-height:100vh;
  background:linear-gradient(180deg,var(--sky2) 0%,var(--sky1) 50%,#D6E6F7 100%) fixed}
main{max-width:1000px;margin:0 auto;padding:18px 18px 80px}

/* ---- sky + clouds (layered radial gradients, no images) ---- */
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.sky i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0))}

/* ---- typography ---- */
h1,h2,h3{margin:0;line-height:1.15}
h3{font:700 1.08rem/1.2 "Inter Tight",Inter,sans-serif;margin-bottom:6px;letter-spacing:-.01em}
/* section titles = translucent label bubbles */
h2{display:inline-block;font:500 1.1rem/1 Inter,sans-serif;text-transform:lowercase;background:var(--glass);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);
  padding:10px 18px;border-radius:14px;box-shadow:0 8px 22px -10px rgba(40,80,140,.35);margin:46px 0 10px;transform:rotate(-1deg)}
.sub{color:#1F2A40;margin:6px 2px 16px;font-size:.95rem}
.pt{font:900 clamp(2.1rem,7.5vw,3.9rem)/.92 "Inter Tight",Inter,sans-serif;letter-spacing:-.045em;text-transform:lowercase;margin:0 0 10px;max-width:92%}
.hl{background:linear-gradient(transparent 52%,var(--yellow) 52% 94%,transparent 94%);padding:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lead{display:inline-block;max-width:640px;margin:0;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:10px 16px;color:#1F2A40}
.phead{position:relative;padding:26px 0 4px}

/* ---- toolbar nav (frosted glass) ---- */
nav{display:flex;gap:6px;overflow-x:auto;padding:7px;margin:4px 0 14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 10px 28px -12px rgba(40,80,140,.35)}
nav a{white-space:nowrap;color:var(--ink);text-decoration:none;font-size:.86rem;font-weight:500;padding:7px 15px;border-radius:99px;transition:background .15s}
nav a:hover{background:var(--pale)}
nav a.on{background:var(--graph);color:#fff}

/* ---- windows ---- */
.win{background:#fff;border-radius:20px;box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.95);overflow:hidden;margin:14px 0}
.wb{display:flex;align-items:center;gap:7px;padding:11px 14px;background:linear-gradient(#fff,#F2F4F8);border-bottom:1px solid var(--line)}
.d{width:12px;height:12px;border-radius:50%;display:block;flex:none}
.d.r{background:var(--dr)}.d.y{background:var(--dy)}.d.g{background:var(--dg)}
.wt,.addr{margin:0 auto;padding:3px 16px;background:#EDF0F6;border-radius:99px;font-size:.76rem;color:var(--mute);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr{flex:1;max-width:none;text-align:left;margin-left:14px;margin-right:30px}
.wbody{padding:20px}
.win .card{box-shadow:none;border:1px solid var(--line)}
.notes .wb{background:linear-gradient(#FFF6BC,#FFEE8A)}
.notes .wbody{background:#FFFDF0}
.photos .wbody,.msgs .wbody{background:var(--off)}

/* ---- hero: browser window ---- */
.hero{margin-top:8px}
.hero-body{position:relative;text-align:center;padding:64px 24px 34px;min-height:430px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.tag{display:inline-block;background:var(--pale);color:#7A1646;font-size:.78rem;font-weight:600;padding:5px 14px;border-radius:99px;max-width:100%}
.hero h1{font:900 clamp(2.9rem,11vw,5.8rem)/.85 "Inter Tight",Inter,sans-serif;letter-spacing:-.05em;text-transform:lowercase;margin:22px 0 8px;position:relative}
.hero h1 .l1{display:block}
.hero h1 em{font-style:normal;display:inline-block;background:var(--yellow);padding:.02em .12em .06em;margin-top:.04em;transform:rotate(-1deg);
  clip-path:polygon(0 9%,3% 0,100% 6%,99% 93%,97% 100%,1% 96%)}
.hero p{max-width:520px;color:var(--mute);margin:18px 0 0}

/* stickers: thin white outline + soft shadow */
.stk{position:absolute;font-size:2.3rem;line-height:1;user-select:none;pointer-events:none;
  filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 6px 8px rgba(40,60,110,.22));
  animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-8px) rotate(var(--r,0deg))}}
.h1s{left:30%;top:22px;--r:-8deg}.h2s{right:11%;bottom:150px;--r:6deg;animation-delay:-2s}.h3s{left:8%;top:46%;font-size:1.8rem;animation-delay:-1s}
.h4s{right:34%;top:40px;font-size:1.5rem;animation-delay:-3s}.h5s{left:24%;bottom:90px;--r:-4deg;animation-delay:-4s}.h6s{right:26%;bottom:96px;--r:8deg;animation-delay:-2.5s}
.h7s{right:9%;top:36px;--r:6deg;animation-delay:-1.5s}.h8s{left:13%;top:300px;font-size:1.4rem;animation-delay:-5s}
.pola{position:absolute;margin:0;background:#fff;padding:7px 7px 4px;border-radius:12px;box-shadow:0 12px 26px -10px rgba(40,60,110,.4);width:118px;text-align:left}
.pola div{height:104px;border-radius:8px;display:grid;place-items:center;font-size:2.4rem}
.pola figcaption{font-size:.62rem;color:var(--mute);padding:4px 2px 0}
.p1{left:3%;top:76px;transform:rotate(-6deg)}.p1 div{background:linear-gradient(135deg,#FFD3E6,#FFF2B8)}
.p2{left:6%;bottom:130px;transform:rotate(4deg);width:104px}.p2 div{height:88px;background:linear-gradient(135deg,#CFE2FB,#F7C6DE)}
.p3{right:3%;top:90px;transform:rotate(5deg);width:128px}.p3 div{height:120px;background:linear-gradient(135deg,#FFE3EF,#CFE2FB)}
.folder{position:absolute;width:48px;height:36px;border-radius:6px 8px 8px 8px;background:linear-gradient(#FFB6D5,#F78DBB);box-shadow:0 6px 12px -6px rgba(200,60,120,.5)}
.folder:before{content:"";position:absolute;left:0;top:-7px;width:20px;height:9px;border-radius:6px 6px 0 0;background:#F78DBB}
.f1{right:6%;bottom:60px}.f2{left:3%;bottom:44px}

/* dock */
.dock{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:10px;padding:10px 14px;margin-top:auto;position:relative;
  background:rgba(214,224,240,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.95);border-radius:22px;box-shadow:0 10px 26px -10px rgba(30,60,110,.4)}
.hero p+.dock{margin-top:40px}
.dock a{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;text-decoration:none;background:#fff;box-shadow:0 4px 10px -4px rgba(30,60,110,.4);transition:transform .18s}
.dock a:nth-child(2){background:var(--pale)}.dock a:nth-child(3){background:#DCE9FF}.dock a:nth-child(4){background:#FFF6B8}.dock a:nth-child(5){background:#FFD6E8}.dock a:nth-child(6){background:var(--graph)}
.dock a:hover,.dock a:focus-visible{transform:translateY(-8px) scale(1.25)}
.dock a:hover+a,.dock a:has(+ a:hover){transform:translateY(-3px) scale(1.1)}
.dock .trash{align-self:center;font-size:1.5rem;opacity:.7;padding-left:10px;border-left:1px solid rgba(0,0,0,.15)}

/* ---- calculator: the dark focal point ---- */
.calc{background:var(--graph);color:#fff;border-radius:28px;padding:20px;box-shadow:var(--shadow);margin:26px auto;max-width:640px}
.calc h3{font:500 .92rem/1.3 Inter,sans-serif;color:#D5D8E2;margin-bottom:12px}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;margin-bottom:16px}
.clock div{background:#161618;border-radius:16px;padding:12px 4px}
.clock b{display:block;font:800 clamp(1.5rem,6vw,2.6rem)/1.1 "Inter Tight",Inter,sans-serif;color:#fff;font-variant-numeric:tabular-nums}
.clock small{color:#B4B8C6;font-size:.75rem}
.calc .bar{background:#4A4A50}.calc .bar i{background:var(--pink)}
.calc .prog{color:#D5D8E2}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.keys span{height:36px;border-radius:99px;background:#4A4A50;color:#fff;display:grid;place-items:center;font-weight:600;font-size:.9rem}
.keys .op{background:var(--pink);color:var(--ink)}
.calc .add{background:rgba(255,255,255,.07);border-color:#6A6A72;color:#fff}
.calc label{font-size:.85rem}

/* ---- cards / grids ---- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:#fff;border:1px solid rgba(255,255,255,.95);border-radius:18px;padding:18px;position:relative;box-shadow:0 12px 30px -16px rgba(40,80,140,.4)}
.card p{margin:0;color:var(--mute);font-size:.93rem}
.from{border-left:5px solid #9DB8DD}.to{border-left:5px solid var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:.76rem;background:var(--pale);color:#7A1646;padding:3px 11px;border-radius:99px;display:inline-block}
.k{font-size:.74rem;font-weight:600;background:var(--yellow);color:var(--ink);padding:3px 10px;border-radius:8px;display:inline-block;margin-bottom:8px}
.topic{display:block;text-decoration:none;color:inherit;transition:transform .15s}
.topic:hover{transform:translateY(-3px) rotate(-.6deg)}
.topic .ic{position:relative;display:grid;place-items:center;width:50px;height:40px;border-radius:7px 9px 9px 9px;background:linear-gradient(#FFB6D5,#F78DBB);font-size:1.25rem;margin:8px 0 12px}
.topic .ic:before{content:"";position:absolute;left:0;top:-7px;width:20px;height:9px;border-radius:6px 6px 0 0;background:#F78DBB}
.topic b{display:block;margin-top:10px;color:var(--ac);font-size:.85rem}
.more{color:var(--ac);font-weight:600}
.ev small{color:var(--ac);font-weight:600}

/* photos-style gallery thumbs */
.thumb{height:92px;border-radius:12px;margin-bottom:12px;position:relative;background:linear-gradient(135deg,#FFD3E6,#FFF2B8)}
.thumb.t1{background:linear-gradient(135deg,#CFE2FB,#F7C6DE)}.thumb.t2{background:linear-gradient(135deg,#FFF6B8,#FFC8DD)}.thumb.t3{background:linear-gradient(135deg,#DCE9FF,#FFE3EF)}
.thumb:after{content:"✨";position:absolute;right:10px;bottom:6px}

/* messages-style bubbles */
.card .bubble{position:relative;background:var(--blue2);color:#fff;padding:10px 14px;border-radius:18px 18px 4px 18px;font-size:.93rem;margin:10px 0 0}
.card .bubble.gray{background:#E9E9EB;color:var(--ink);border-radius:18px 18px 18px 4px}

/* about: text window + decorative map */
.about{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:stretch}
.about .win{margin:14px 0}
.map{margin:14px 0;border-radius:20px;overflow:hidden;border:2px solid #fff;box-shadow:var(--shadow);min-height:190px}
.map svg{display:block;width:100%;height:100%}

/* timeline */
.tl{border-left:2px solid var(--pink2);margin-left:6px;padding-left:20px}
.tl>div{position:relative;margin-bottom:18px}.tl>div:last-child{margin-bottom:0}
.tl>div:before{content:"";position:absolute;left:-27px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--pink);border:3px solid #fff;box-sizing:content-box;margin:-3px 0 0 -3px}
.tl b{display:block}.tl small{color:var(--mute)}

/* skills / bars */
.sk{margin-bottom:16px}.sk .r{display:flex;justify-content:space-between;align-items:center;font-size:.92rem;font-weight:500;margin-bottom:6px;gap:8px}.sk .r span{color:var(--mute);font-weight:400}
.sk .note{display:block;color:var(--mute);font-size:.82rem;margin-top:4px}
.bar{height:10px;background:#E4EAF4;border-radius:9px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--pink2),var(--pink));border-radius:9px}
.bar u{position:absolute;inset:0 auto 0 0;background:var(--blue);opacity:.3;border-radius:9px}
.legend{font-size:.8rem;color:var(--mute);margin-bottom:14px}
.road{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.road h3{display:inline-block;background:var(--pale);color:#7A1646;padding:4px 12px;border-radius:99px;font:600 .85rem Inter,sans-serif}
.road ul{margin:10px 0 0;padding-left:18px;font-size:.92rem}.road li{margin-bottom:6px}
.goal{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.goal input{margin-top:5px;width:18px;height:18px;accent-color:var(--pink);flex:none}
.goal label{cursor:pointer;flex:1}.goal small{display:block;color:var(--mute)}
.goal input:checked+label{opacity:.55;text-decoration:line-through}
.prog{font-size:.9rem;color:var(--mute);margin-bottom:6px}
.gt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.gt .k{margin:0}
.pr-0{background:var(--pink);color:var(--ink)}.pr-1{background:var(--yellow)}
.st-1{background:#DCE9FF;color:#1B49B0}.st-2{background:#C9F2D3;color:#125B25}.late{background:#FFD9D9;color:#9B1C1C}

footer{margin:56px auto 0;width:fit-content;max-width:100%;text-align:center;color:#1F2A40;font-size:.85rem;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:99px;padding:10px 20px}

/* ---- edit mode (kept, restyled) ---- */
.x{background:none;border:0;color:var(--red);cursor:pointer;font-size:1rem;padding:2px 6px}
.card .x{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.85);border-radius:50%;width:26px;height:26px;padding:0}
.chips .x{position:static;padding:0 0 0 4px;font-size:.8rem;background:none;width:auto;height:auto}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:12px;border:1.5px dashed var(--pink2);border-radius:14px;background:rgba(255,255,255,.7)}
.add input,.dt{flex:1 1 140px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:.9rem}
.add input[type=number],.n{flex:0 0 70px;width:56px}
select.dt{flex:1 1 110px}
.btn{background:var(--pink);color:var(--ink);border:0;border-radius:99px;padding:8px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.bar-edit{position:sticky;top:0;z-index:9;background:var(--graph);color:#fff;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem}
.bar-edit .btn{background:#fff;padding:6px 14px}
[contenteditable]{outline:1.5px dashed var(--pink);outline-offset:3px;border-radius:4px}

a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---- scroll reveal (windows zoom in once) ---- */
html.reveal .rv{transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1)}
html.reveal .rv:not(.shown){opacity:0;transform:scale(.97) translateY(10px)}

/* ---- password screen ---- */
#lock{position:fixed;inset:0;display:grid;place-items:center;padding:18px;z-index:20}
#lock[hidden]{display:none}
.lockwin{width:min(360px,100%);margin:0}
.lockwin form{display:flex;flex-direction:column;gap:10px;text-align:center;padding:26px}
.avatar{width:76px;height:76px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:2rem;background:linear-gradient(135deg,#FFD3E6,#F7A8C8);box-shadow:0 10px 24px -10px rgba(200,60,120,.6)}
.lockwin label{font-size:.85rem;color:var(--mute);text-align:left}
.lockwin input{padding:11px 14px;border:1px solid var(--line);border-radius:99px;font:inherit;background:#fff;color:var(--ink)}
.lockwin .btn{padding:11px 16px}
#pwerr{margin:0;min-height:1.4em;color:var(--red);font-size:.88rem}

/* ---- responsive ---- */
@media(max-width:940px){.pola,.folder{display:none}.hero-body{min-height:0}}
@media(max-width:700px){
  main{padding:12px 12px 64px}
  .about{grid-template-columns:1fr}.map{min-height:150px;margin-top:0}
  .stk{font-size:1.6rem}.h2s,.h5s,.h6s,.h8s,.h4s,.h3s{display:none}.h1s{left:8%}.h7s{right:6%}
  .hero-body{padding:56px 16px 24px}.wbody{padding:14px}
  .addr{margin-right:0}.pt{max-width:100%}
  .dock{gap:6px;padding:8px 10px}.dock a{width:42px;height:42px;font-size:1.3rem;border-radius:12px}
  .phead .s2{display:none}.dock .trash{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.phead .stk.s1{right:4%;top:14px;--r:8deg}.phead .stk.s2{right:15%;top:56px;font-size:1.6rem;animation-delay:-2s}
</style>
</head>
<body>
<!-- Sky background with blurry clouds (decorative) -->
<div class="sky" aria-hidden="true"><i style="left:-8%;top:2%;width:520px;height:260px"></i><i style="left:55%;top:0%;width:620px;height:300px"></i><i style="left:20%;top:38%;width:700px;height:320px"></i><i style="left:70%;top:48%;width:560px;height:280px"></i><i style="left:-5%;top:70%;width:600px;height:300px"></i><i style="left:45%;top:82%;width:720px;height:320px"></i><i style="left:85%;top:15%;width:420px;height:220px"></i></div>
<div id="toolbar"></div>
<!-- Tela de senha -->
<div id="lock" hidden><section class="win lockwin"><div class="wb" aria-hidden="true"><i class="d r"></i><i class="d y"></i><i class="d g"></i><span class="wt">pdi</span></div>
<form class="wbody" id="lockform" autocomplete="off"><div class="avatar" aria-hidden="true">🔒</div>
<label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required>
<button class="btn" id="pwgo">Entrar</button><p id="pwerr" role="alert" aria-live="polite"></p></form></section></div>
<main id="app"></main>
<!-- data.js = seus dados em texto (use só no seu computador). data.enc.js = versão criptografada (é a que você publica). -->
<script src="data.js"></script>
<script src="data.enc.js"></script>
<script>
const EDIT = new URLSearchParams(location.search).has('edit');
const KEY = 'pdi-data-v3';
const clone = o => JSON.parse(JSON.stringify(o));
let D, DATA_SRC;
function initData() {
D = clone(DATA_SRC);
if (EDIT) { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) D = { ...D, ...s, texts: { ...D.texts, ...s.texts }, timer: { ...D.timer, ...s.timer } }; } catch (e) {} }
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)) } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const X = (l, i, j) => EDIT ? `<button class="x" title="Excluir" data-del="${l}:${i}${j !== undefined ? ':' + j : ''}">✕</button>` : '';
const ce = k => EDIT ? `contenteditable data-t="${k}"` : '';
const chips = s => s.split(',').map(c => c.trim()).filter(Boolean).map(c => `<span>${esc(c)}</span>`).join('');
const chipBox = k => `<div class="chips">${EDIT ? `<span ${ce(k)}>${esc(D.texts[k])}</span>` : chips(D.texts[k])}</div>`;
const form = (l, fields) => !EDIT ? '' : `<form class="add" data-add="${l}">${fields.map(f => `<input name="${f[0]}" placeholder="${f[1]}" ${f[2] ? 'type="number" min="1" max="5"' : ''} required>`).join('')}<button class="btn">+ Adicionar</button></form>`;
const fmt = s => s.split('-').reverse().join('/');

const PAGES = [
  ['sobre', 'Sobre', '👤', 'Quem sou e meu histórico.'],

function R() {
  if (!D) return;
  const k = location.hash.replace('#/', '') || 'home';
  const key = views[k] ? k : 'home';
  const pg = PAGES.find(p => p[0] === key);
  document.title = (pg ? pg[1] + ' · ' : '') + 'PDI · ' + D.texts.nome;
  document.getElementById('app').innerHTML =
    `<nav><a href="#/" class="${key === 'home' ? 'on' : ''}">Início</a>${PAGES.map(p => `<a href="#/${p[0]}" class="${p[0] === key ? 'on' : ''}">${p[1]}</a>`).join('')}</nav>` +
    views[key]() + `<footer>Documento vivo, revisado a cada trimestre. <span ${ce('nome')}>${esc(D.texts.nome)}</span></footer>`;
  tick(); reveal();
}

function tick() {
  const td = document.getElementById('td'); if (!td) return;
  const s = new Date(D.timer.start + 'T00:00:00'), e = new Date(D.timer.end + 'T23:59:59'), now = Date.now();
  const rem = Math.max(0, e - now), p = Math.min(1, Math.max(0, (now - s) / (e - s))) || 0;
  const set = (id, v) => document.getElementById(id).textContent = v;
  set('td', Math.floor(rem / 864e5)); set('th', Math.floor(rem / 36e5) % 24);
  set('tmn', Math.floor(rem / 6e4) % 60); set('ts', Math.floor(rem / 1e3) % 60);
  document.getElementById('tp').style.width = (p * 100).toFixed(1) + '%';
  set('tt', `Início: ${fmt(D.timer.start)} · Fim: ${fmt(D.timer.end)} · ${(p * 100).toFixed(1)}% do caminho percorrido`);
}
setInterval(tick, 1000);

/* ===== NEW (design only): windows zoom in once as they scroll into view ===== */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
let io;
function reveal() {
  if (EDIT || REDUCE || !('IntersectionObserver' in window)) return;
  document.documentElement.classList.add('reveal');
  io = io || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('shown'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px' });
  document.querySelectorAll('.win,.calc').forEach(el => { el.classList.add('rv'); io.observe(el); });
}

if (EDIT) {
  document.getElementById('toolbar').innerHTML = `<div class="bar-edit"><b>Modo edição</b><span>(salvo neste navegador)</span>
  <button class="btn" id="exp">Exportar data.js</button><button class="btn" id="encb">Gerar versão com senha</button><button class="btn" id="rst">Restaurar padrão</button></div>`;
  document.getElementById('exp').onclick = () => {
    const blob = new Blob([`const DEFAULT_DATA = ${JSON.stringify(D, null, 2)};\n`], { type: 'text/javascript' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'data.js'; a.click();
  };
  // Protege os dados atuais com uma senha e baixa o data.enc.js (é esse arquivo que você publica)
  document.getElementById('encb').onclick = async () => {
    const pw = prompt('Escolha a senha do seu PDI (mínimo 8 caracteres):');
    if (pw === null) return;
    if (pw.length < 8) { alert('Use uma senha com pelo menos 8 caracteres.'); return; }
    const enc = new TextEncoder(), salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 250000;
    const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(D))));
    const b = u => btoa(String.fromCharCode(...u));
    const out = `const ENCRYPTED_DATA=${JSON.stringify({ salt: b(salt), iv: b(iv), iter, ct: b(ct) })};\n`;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'text/javascript' })); a.download = 'data.enc.js'; a.click();
  };
  document.getElementById('rst').onclick = () => { if (confirm('Apagar edições e voltar ao data.js original?')) { try { localStorage.removeItem(KEY) } catch (e) {} location.reload(); } };
}

document.addEventListener('click', e => {
  if (!EDIT) return;
  const t = e.target;
  if (t.dataset.del) {
    const [l, i, j] = t.dataset.del.split(':');
    if (!confirm('Excluir este item?')) return;
    if (l === 'tech') D.tech[i].splice(j, 1); else if (j !== undefined) D.roadmap[i].items.splice(j, 1); else D[l].splice(i, 1);
    save(); R();
  } else if (t.dataset.item) {
    const v = prompt('Novo item do roadmap:'); if (v) { D.roadmap[t.dataset.item].items.push(v); save(); R(); }
  } else if (t.dataset.tech) {
    const v = prompt('Nova tecnologia:'); if (v) { D.tech[t.dataset.tech].push(v); save(); R(); }
  } else if (t.dataset.mv) {
    const x = D.soft[t.dataset.mv]; x.g = x.g === 'pratico' ? 'evolucao' : 'pratico'; save(); R();
  } else if (t.dataset.hor) {
    const v = prompt('Nome do horizonte (ex.: 2029):'); if (v) { D.roadmap.push({ h: v, items: [] }); save(); R(); }
  }
});
document.addEventListener('submit', e => {
  const l = e.target.dataset.add; if (!l) return;
  e.preventDefault();
  const o = Object.fromEntries(new FormData(e.target));
  if (l === 'skills' || l === 'soft') { o.a = +o.a; o.m = +o.m; }
  if (l === 'soft') o.g = o.g === 'Já pratico' ? 'pratico' : 'evolucao';
  if (l === 'goals') o.p = +o.p || 0;
  D[l].push(o); save(); R();
});
document.addEventListener('change', e => {
  if (!EDIT) return;
  const t = e.target;
  if (t.dataset.g !== undefined) { const g = D.goals[t.dataset.g], k = t.dataset.k; g[k] = k === 'p' ? Math.min(100, Math.max(0, +t.value || 0)) : t.value; if (k === 'p' && g.p >= 100) g.s = 'Concluída'; if (k === 's' && g.s === 'Concluída') g.p = 100; save(); R(); }
  else if (t.dataset.timer) { if (t.value) { D.timer[t.dataset.timer] = t.value; save(); tick(); } }
  else if (t.dataset.l) { D[t.dataset.l][t.dataset.i][t.dataset.k] = Math.min(5, Math.max(1, +t.value || 1)); save(); R(); }
});
document.addEventListener('focusout', e => {

});
window.addEventListener('hashchange', () => { R(); window.scrollTo(0, 0); });
/* ===== NEW: password gate (AES-GCM + PBKDF2). Without the right password the data stays unreadable ===== */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptData(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENCRYPTED_DATA.salt), iterations: ENCRYPTED_DATA.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENCRYPTED_DATA.iv) }, key, b64(ENCRYPTED_DATA.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function boot(src) { DATA_SRC = src; initData(); document.getElementById('lock').hidden = true; R(); }
async function tryUnlock(pw, remember) {
  try {
    const data = await decryptData(pw);
    if (remember) { try { sessionStorage.setItem('pdi-pw', pw) } catch (e) {} }
    boot(data); return true;
  } catch (e) { return false; }
}
if (typeof DEFAULT_DATA !== 'undefined') boot(DEFAULT_DATA);            // local use with data.js
else if (typeof ENCRYPTED_DATA !== 'undefined') {                       // published: needs password
  const lock = document.getElementById('lock'), err = document.getElementById('pwerr');
  if (!(window.crypto && crypto.subtle)) { lock.hidden = false; err.textContent = 'Abra este site por https para continuar.'; }
  else {
    let saved = null; try { saved = sessionStorage.getItem('pdi-pw') } catch (e) {}
    (async () => {
      if (saved && await tryUnlock(saved, false)) return;
      lock.hidden = false; document.getElementById('pw').focus();
    })();
    document.getElementById('lockform').addEventListener('submit', async e => {
      e.preventDefault(); err.textContent = '';
      const btn = document.getElementById('pwgo'); btn.disabled = true;
      const ok = await tryUnlock(document.getElementById('pw').value, true);
      btn.disabled = false;
      if (!ok) { err.textContent = 'Senha incorreta.'; document.getElementById('pw').select(); }
    });
  }
} else document.getElementById('app').textContent = 'Não encontrei data.js nem data.enc.js.';
</script>
